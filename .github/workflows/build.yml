name: Build mod jar
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: notsofullfullscreen-mod/notsofullfullscreen
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Build
        run: sh ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: notsofullfullscreen-jar
          path: notsofullfullscreen-mod/notsofullfullscreen/build/libs/*.jar
